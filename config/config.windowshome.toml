[bootstrap.packages]
"winget:Zen-Team.Zen-Browser" = "latest"
"winget:Tailscale.Tailscale" = "latest"
"scoop:which" = "latest"

[bootstrap.hooks.pre-packages]
run_windows = "mise run install-scoop"

[tools]

[dotfiles]
"~/OneDrive/Documents/PowerShell/Microsoft.PowerShell_profile.ps1" = { mode = "track", variants = [{ os = "windows", profile = "windowshome" }] }
"~/OneDrive/Documents/PowerShell/Modules/ProfileHelpers/ProfileHelpers.psm1" = { mode = "track", variants = [{ os = "windows", profile = "windowshome" }] }
"~/OneDrive/Documents/PowerShell/Profile/prompt.ps1" = { mode = "track", variants = [{ os = "windows", profile = "windowshome" }] }
"~/OneDrive/Documents/PowerShell/Profile/tools.ps1" = { mode = "track", variants = [{ os = "windows", profile = "windowshome" }] }

[tasks.install-scoop]
description = "Install Scoop for current user if missing"
shell = "pwsh -NoProfile -Command"
run = '''
$ErrorActionPreference = "Stop"
$scoopDir = if ($env:SCOOP) { $env:SCOOP } else { Join-Path $HOME "scoop" }
if (Test-Path -LiteralPath $scoopDir -PathType Container) {
    Write-Host "Scoop directory already exists at $scoopDir; skipping installation."
} elseif (-not (Get-Command scoop -ErrorAction SilentlyContinue)) {
    Invoke-RestMethod https://get.scoop.sh | Invoke-Expression
}
'''
