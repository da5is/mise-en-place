[bootstrap.packages]
"winget:Microsoft.PowerShell" = "latest"
"winget:GitHub.CopilotApp" = "latest"
"winget:Git.Git" = "latest"
"winget:Microsoft.PowerToys" = "latest"
"winget:cjpais.Handy" = "latest"
"winget:Microsoft.VisualStudioCode" = "latest"

[tools]
"aqua:LargeModGames/spotatui" = "latest"
azd = "latest"
azure-cli = { version = "latest", version_prefix = "azure-cli-", platforms = { windows-arm64 = { asset_pattern = "azure-cli-{{ version }}-x64.zip" } } }
copilot-cli = "latest"
github-cli = "latest"
"github:obsidianmd/obsidian-releases" = "latest"
lazygit = "latest"
neovim = "latest"
node = "latest"
python = "latest"
"github:zellij-org/zellij" = "latest"

[env]
PIP_INDEX_URL = "https://packagefeedproxy.microsoft.io/pypi/simple/"
UV_DEFAULT_INDEX = "https://packagefeedproxy.microsoft.io/pypi/simple/"
MISE_PYPI_REGISTRY_URL = "https://packagefeedproxy.microsoft.io/pypi/simple/{}/"
NPM_CONFIG_REGISTRY = "https://packagefeedproxy.microsoft.io/npm/"

[dotfiles]
"~/.config/mise/config.toml" = { mode = "track" }
"~/OneDrive - Microsoft/Documents/PowerShell/Microsoft.PowerShell_profile.ps1" = { mode = "track" }
