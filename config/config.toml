[tools]
github-cli = "latest"
hunkdiff = "latest"
lazygit = "latest"
neovim = "latest"
node = "latest"
python = "latest"
uv = "latest"

[bootstrap.services.mise-history]
builtin = "history-watch"

[dotfiles]
"~/.config/mise" = { mode = "track" }
"~/.config/mise/config.toml" = { mode = "track" }
"~/.config/mise/config.linux.toml" = { mode = "track" }
"~/.config/mise/config.linuxgui.toml" = { mode = "track" }
"~/.config/mise/config.windows.toml" = { mode = "track" }
"~/.config/mise/config.windowshome.toml" = { mode = "track" }
"~/.config/mise/config.windowswork.toml" = { mode = "track" }
"~/.config/mise/config.work.toml" = { mode = "track" }

[history]
exclude = ["*.local.toml"]
