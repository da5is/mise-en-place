[tools]
mosh = "latest"
tmux = "latest"
"github:pingdotgg/t3code" = "latest"
claude = "latest"
codex = "latest"
opencode = { version = "latest", allow_builds = ["@opencode/cli"] }
azure-cli = { version = "latest", dependency_prereleases = "allow", with = ["pip"] }
github-cli = "latest"
copilot-cli = "latest"
azd = "latest"

[bootstrap.packages]
"apt:fish" = "latest"

[tasks.bootstrap]

[tasks.configure-fonts]
shell = "bash -c"
run = '''
set -euo pipefail

mkdir -p ~/.config/fontconfig/conf.d

cat > ~/.config/fontconfig/conf.d/99-rendering.conf <<'XML'
<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <match target="font">
    <edit name="antialias" mode="assign">
      <bool>true</bool>
    </edit>
    <edit name="hinting" mode="assign">
      <bool>true</bool>
    </edit>
    <edit name="hintstyle" mode="assign">
      <const>hintslight</const>
    </edit>
    <edit name="rgba" mode="assign">
      <const>rgb</const>
    </edit>
    <edit name="lcdfilter" mode="assign">
      <const>lcddefault</const>
    </edit>
  </match>
</fontconfig>
XML

fc-cache -f
'''

[tasks.install-bicep]
shell = "bash -c"
run = '''
set -euo pipefail

az bicep install
az bicep version
'''

[tasks.install-copilot-app]
shell = "bash -c"
run = '''
set -euo pipefail

case "$(dpkg --print-architecture)" in
  amd64) arch="x64" ;;
  arm64) arch="arm64" ;;
  *) echo "Unsupported architecture" >&2; exit 1 ;;
esac

url="https://github.com/github/app/releases/latest/download/GitHub-Copilot-linux-${arch}.deb"

tmp="$(mktemp --suffix=.deb)"
trap 'rm -f "$tmp"' EXIT

curl -fL --retry 3 -o "$tmp" "$url"
sudo apt-get install -y "$tmp"
'''

[tasks.install-edge]
shell = "bash -c"
run = '''
set -euo pipefail

sudo apt-get update
sudo apt-get install -y \
  curl gnupg ca-certificates fontconfig \
  fonts-crosextra-carlito fonts-crosextra-caladea \
  fonts-liberation2 fonts-noto-core fonts-noto-color-emoji

curl -fsSL https://packages.microsoft.com/keys/microsoft.asc \
  | gpg --dearmor \
  | sudo tee /usr/share/keyrings/microsoft-edge.gpg >/dev/null

echo "deb [arch=amd64 signed-by=/usr/share/keyrings/microsoft-edge.gpg] https://packages.microsoft.com/repos/edge stable main" \
  | sudo tee /etc/apt/sources.list.d/microsoft-edge.list >/dev/null

sudo apt-get update
sudo apt-get install -y microsoft-edge-stable
'''

[env]
_.path = ["{{env.HOME}}/.azure/bin"]


[bootstrap.user]
login_shell = "fish"
